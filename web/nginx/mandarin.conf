# Server block for the Mandarin app. Include it from the http{} context of the
# nginx that sits behind your auth proxy. Mount web/ at /srv/mandarin,
# web/common at /srv/common, and web/nginx/snippets at /etc/nginx/snippets.
server {
    listen 8080;
    server_name mandarin.example.com;
    root /srv/mandarin;
    index index.html;

    # mandarin-api: whoami, the bank, the caller's own progress. The API gates
    # on the forwarded identity header itself (empty allowlist = refuse all);
    # this layer just routes. mandarin-api publishes no ports.
    location /api/mandarin/ {
        set $mandarin mandarin-api;
        rewrite ^/api/mandarin/(.*)$ /$1 break;
        proxy_pass http://$mandarin:8080;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 30s;
    }

    include /etc/nginx/snippets/app.conf;
}
