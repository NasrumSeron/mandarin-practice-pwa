# The static half of the app. Include it once per server block so every
# hostname caches identically.

# Shared assets (the app icons). Mount web/common at /srv/common.
location /common/ {
    alias /srv/common/;
    include /etc/nginx/snippets/sec.conf;
    # Revalidate rather than cache hard: a stale file in the HTTP cache would
    # be baked into the service worker's cache on its next install.
    add_header Cache-Control "no-cache" always;
}

location ~* \.png$ {
    include /etc/nginx/snippets/sec.conf;
    add_header Cache-Control "public, max-age=604800" always;
}

# Must revalidate, or a stale service worker pins an old app forever.
location = /sw.js       { include /etc/nginx/snippets/sec.conf;
                          add_header Cache-Control "no-cache" always; }
location = /app.js      { include /etc/nginx/snippets/sec.conf;
                          add_header Cache-Control "no-cache" always; }
location = /index.html  { include /etc/nginx/snippets/sec.conf;
                          add_header Cache-Control "no-cache" always; }
location = /            { include /etc/nginx/snippets/sec.conf;
                          add_header Cache-Control "no-cache" always; }

location / {
    include /etc/nginx/snippets/sec.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
