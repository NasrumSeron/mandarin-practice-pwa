proxy_http_version 1.1;
proxy_set_header Host $host;

# RESOLVE UPSTREAMS PER REQUEST, NOT ONCE AT STARTUP
# --------------------------------------------------
# nginx resolves a literal hostname in proxy_pass exactly once, when the config
# loads, and caches that IP forever. Rebuild a bot and Docker hands it a new
# address; nginx keeps sending traffic to the old one — which, on a busy
# bridge network, another container has usually been given by then.
#
# That is not hypothetical: after an API container is rebuilt, requests can keep
# going to the old address, which another container may since have been given.
#
# Naming the upstream through a VARIABLE forces a fresh lookup per request.
# 127.0.0.11 is Docker's embedded DNS. `valid=10s` caps how stale an answer can
# be; a rebuild is visible within ten seconds instead of never.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# THE IDENTITY HEADER
# -------------------
# An auth proxy (e.g. Cloudflare Access) authenticates at the edge and forwards the verified
# address here. Forwarding it explicitly rather than relying on nginx's
# pass-through makes it one grep away when someone asks how the split works.
#
# This does NOT make the header unforgeable — it is still whatever the client
# sent. It is trustworthy because the only client that can reach this nginx is
# the authenticating proxy (e.g. cloudflared): no service in this stack
# publishes a port. See api/app/identity.py for the full statement of what that
# does and does not buy, and what to do about it if a port is ever published.
proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;

add_header Cache-Control "no-store" always;
include /etc/nginx/snippets/sec.conf;
