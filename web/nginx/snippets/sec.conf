# Defence in depth. This all sits behind an auth proxy, but add_header is
# cheap and "behind the proxy" can be wrong.
#
# Repeated per location on purpose: nginx's add_header is NOT inherited into a
# location that declares its own, and every location here declares a
# Cache-Control. Inheriting-by-accident is how these quietly stop applying.
add_header X-Content-Type-Options nosniff      always;
add_header X-Frame-Options        DENY         always;
add_header Referrer-Policy        no-referrer  always;
